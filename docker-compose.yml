# =============================================================
#  Ask My Docs — Docker Compose
#  Usage:  docker compose up --build
# =============================================================

services:

  # ── Backend (FastAPI + uvicorn) ────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ask-my-docs-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override ChromaDB path to the shared volume mount
      CHROMA_PERSIST_DIR: /app/data/chroma
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    volumes:
      # Persist ChromaDB vector index between restarts
      - chroma_data:/app/data/chroma
      # Persist evaluation results
      - ./backend/evaluation/results:/app/evaluation/results
      # Mount corpus documents (read-only inside container)
      - ./backend/data/corpus:/app/data/corpus:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s # allow time for model downloads on first run

  # ── Frontend (nginx serving Vite/React build) ─────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ask-my-docs-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 5s
      retries: 3

# ── Volumes ─────────────────────────────────────────────────
volumes:
  chroma_data:
    driver: local
    name: ask-my-docs-chroma
